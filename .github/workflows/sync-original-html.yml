name: Verify and transfer original HTML bytes
on:
  push:
    branches: [chore/sync-original-openai-html]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Restore exact approved file and verify GitHub readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .sync_original_html/transfer.py
